<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ai_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ai_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#d4ff24"/>
    </linearGradient>
    <filter id="ai_glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ai_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- Quantum Orbit Ellipse 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(-30 32 32)"/>
  <!-- Quantum Orbit Ellipse 2 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#d4ff24" stroke-width="1.5" stroke-dasharray="4 3" transform="rotate(45 32 32)"/>
  <!-- Glowing Center AI Star Core -->
  <path d="M32 10 Q32 25 17 32 Q32 32 32 54 Q32 32 47 32 Q32 25 32 10 Z" fill="url(#ai_grad)" filter="url(#ai_glow)"/>
  <circle cx="32" cy="32" r="5" fill="#ffffff" filter="url(#ai_glow)"/>
  <!-- Satellite Orbiting Energy Dots -->
  <circle cx="14" cy="22" r="3" fill="#d4ff24" filter="url(#ai_glow)"/>
  <circle cx="48" cy="44" r="3.2" fill="#38bdf8" filter="url(#ai_glow)"/>
  <circle cx="46" cy="18" r="2" fill="#ffffff"/>
</svg>