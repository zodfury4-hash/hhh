<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ml_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ml_bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="ml_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ml_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Main Chat Bubble -->
  <path d="M14 18 C14 14 17 11 21 11 H43 C47 11 50 14 50 18 V34 C50 38 47 41 43 41 H24 L16 47 V41 H21 C17 41 14 38 14 34 Z" 
        fill="url(#ml_bubble)" filter="url(#ml_glow)"/>

  <!-- URL link chip inside bubble -->
  <rect x="19" y="17" width="26" height="8" rx="4" fill="rgba(15,23,42,0.85)"/>
  <circle cx="24" cy="21" r="1.8" fill="#d4ff24"/>
  <text x="34" y="23" font-family="system-ui, sans-serif" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">hea.to/sms</text>

  <!-- Lightning bolt in bubble -->
  <polygon points="32,27 28,34 32,34 30,39 36,32 32,32" fill="#d4ff24" filter="url(#ml_glow)"/>

  <!-- SMS Signal waves right side -->
  <path d="M48 20 C52 23 52 29 48 32" fill="none" stroke="#d4ff24" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 17 C57 22 57 32 52 36" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>