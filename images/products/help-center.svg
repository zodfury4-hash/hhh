<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hc_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2a3b"/>
      <stop offset="100%" stop-color="#030d14"/>
    </linearGradient>
    <linearGradient id="hc_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="hc_accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="hc_glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hc_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(0,242,254,0.5)" stroke-width="1.5"/>
  <!-- Outer Lifebuoy Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#hc_ring)" stroke-width="7" filter="url(#hc_glow)"/>
  <!-- 4 White Safety Straps -->
  <rect x="30" y="8" width="4" height="8" rx="2" fill="#ffffff"/>
  <rect x="30" y="48" width="4" height="8" rx="2" fill="#ffffff"/>
  <rect x="8" y="30" width="8" height="4" rx="2" fill="#ffffff"/>
  <rect x="48" y="30" width="8" height="4" rx="2" fill="#ffffff"/>
  <!-- Center Support Question Shield -->
  <circle cx="32" cy="32" r="10" fill="#081426" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M30 27 C30 25.5 31 24.5 32 24.5 C33.2 24.5 34 25.3 34 26.5 C34 28 32.5 28.8 32 30 V31.5" fill="none" stroke="url(#hc_accent)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="35" r="1.2" fill="#fde047"/>
</svg>