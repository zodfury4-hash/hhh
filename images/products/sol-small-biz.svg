  <rect x="34" y="33" width="10" height="10" fill="#38bdf8" opacity="0.6"/>
  <!-- Striped Boutique Awning -->
  <path d="M13 22 L16 16 H48 L51 22 C51 24.5 49 26 47 26 C45 26 43 24.5 43 26 C43 27.5 40 27.5 39 26 C38 27.5 35 27.5 34 26 C33 27.5 30 27.5 29 26 C28 27.5 25 27.5 24 26 C23 27.5 20 27.5 19 26 C17 26 13 24.5 13 22 Z" fill="url(#sb_awning)" filter="url(#sb_glow)"/>
