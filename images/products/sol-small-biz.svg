    <filter id="sb_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sb_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
