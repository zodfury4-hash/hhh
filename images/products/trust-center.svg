<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tc_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="tc_shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="tc_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tc_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <!-- Large Shield -->
  <path d="M32 12 L48 18 V30 C48 40 41 49 32 52 C23 49 16 40 16 30 V18 Z" fill="url(#tc_shield)" stroke="#d4ff24" stroke-width="2" filter="url(#tc_glow)"/>
  <!-- Shield Checkmark -->
  <polyline points="25,32 30,37 39,26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>