<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hsp_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="hsp_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="hsp_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hsp_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
  <!-- Service Bell / Food Cloche -->
  <path d="M14 44 H50 C50 44 48 24 32 24 C16 24 14 44 14 44 Z" fill="url(#hsp_gold)" filter="url(#hsp_glow)"/>
  <!-- Bell Stand Tray -->
  <rect x="10" y="44" width="44" height="5" rx="2.5" fill="#fde047"/>
  <!-- Top Push Knob -->
  <rect x="30" y="18" width="4" height="6" rx="1.5" fill="#fde047"/>
  <circle cx="32" cy="18" r="3.5" fill="#ffffff" filter="url(#hsp_glow)"/>
  <!-- 5 Stars above -->
  <polygon points="32,9 33,11 35.5,11.2 33.7,12.8 34.2,15 32,13.8 29.8,15 30.3,12.8 28.5,11.2 31,11" fill="#d4ff24"/>
  <circle cx="23" cy="12" r="1.5" fill="#d4ff24"/>
  <circle cx="41" cy="12" r="1.5" fill="#d4ff24"/>
</svg>