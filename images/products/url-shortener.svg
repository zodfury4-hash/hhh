<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="us_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="us_chain1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="us_chain2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4ff24"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="us_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#us_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="48" cy="16" r="14" fill="rgba(56,189,248,0.12)" filter="url(#us_glow)"/>
  <circle cx="16" cy="48" r="12" fill="rgba(212,255,36,0.1)" filter="url(#us_glow)"/>
  
  <!-- Left Link Loop -->
  <path d="M28 22 H24 C18.5 22 14 26.5 14 32 C14 37.5 18.5 42 24 42 H28" 
        fill="none" stroke="url(#us_chain1)" stroke-width="4.5" stroke-linecap="round" filter="url(#us_glow)"/>
  <!-- Right Link Loop -->
  <path d="M36 22 H40 C45.5 22 50 26.5 50 32 C50 37.5 45.5 42 40 42 H36" 
        fill="none" stroke="url(#us_chain2)" stroke-width="4.5" stroke-linecap="round" filter="url(#us_glow)"/>
  <!-- Center connecting bar -->
  <line x1="25" y1="32" x2="39" y2="32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Mini short badge pill -->
  <rect x="18" y="47" width="28" height="11" rx="5.5" fill="#0284c7" opacity="0.9"/>
  <text x="32" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">hea.li/</text>
  <!-- Sparkle top-right -->
  <polygon points="48,10 50,14 54,16 50,18 48,22 46,18 42,16 46,14" fill="#d4ff24" filter="url(#us_glow)"/>
</svg>