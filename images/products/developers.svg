<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dev_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="dev_code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4ff24"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="dev_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#dev_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <!-- Terminal window shell -->
  <rect x="12" y="14" width="40" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Terminal dots -->
  <circle cx="17" cy="19" r="1.5" fill="#f43f5e"/>
  <circle cx="22" cy="19" r="1.5" fill="#eab308"/>
  <circle cx="27" cy="19" r="1.5" fill="#22c55e"/>
  <!-- Code brackets < / > -->
  <path d="M22 28 L17 33 L22 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="27" x2="26" y2="39" stroke="#d4ff24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 28 L39 33 L34 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blinking cursor -->
  <rect x="42" y="32" width="5" height="2" fill="#d4ff24" filter="url(#dev_glow)"/>
</svg>