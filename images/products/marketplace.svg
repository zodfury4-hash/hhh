<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mp_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="mp_plug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="mp_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#mp_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- Power Plug & Socket Interlock -->
  <rect x="22" y="24" width="20" height="16" rx="5" fill="url(#mp_plug)" filter="url(#mp_glow)"/>
  <!-- Prongs -->
  <rect x="26" y="16" width="3.5" height="9" rx="1.5" fill="#d4ff24"/>
  <rect x="34.5" y="16" width="3.5" height="9" rx="1.5" fill="#d4ff24"/>
  <!-- Wire cord -->
  <path d="M32 40 V48 C32 50 35 52 38 52" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Floating connection sparks -->
  <circle cx="16" cy="20" r="2" fill="#d4ff24" filter="url(#mp_glow)"/>
  <circle cx="48" cy="20" r="2" fill="#d4ff24" filter="url(#mp_glow)"/>
  <circle cx="48" cy="46" r="2.5" fill="#38bdf8"/>
</svg>