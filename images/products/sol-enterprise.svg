<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ent_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ent_tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="ent_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ent_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- Grand Skyscraper Spire -->
  <polygon points="32,9 37,20 37,50 27,50 27,20" fill="url(#ent_tower)" filter="url(#ent_glow)"/>
  <!-- Left and Right flanking corporate towers -->
  <rect x="14" y="26" width="12" height="24" rx="2" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <rect x="38" y="26" width="12" height="24" rx="2" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <!-- Global connectivity ring -->
  <ellipse cx="32" cy="35" rx="22" ry="7" fill="none" stroke="#d4ff24" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#ent_glow)"/>
  <circle cx="10" cy="35" r="2" fill="#d4ff24"/>
  <circle cx="54" cy="35" r="2" fill="#d4ff24"/>
  <!-- Tower beacon light -->
  <circle cx="32" cy="9" r="2.5" fill="#ffffff" filter="url(#ent_glow)"/>
</svg>