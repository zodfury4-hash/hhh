<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="med_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="med_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="med_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#med_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- Clapperboard bottom body -->
  <rect x="14" y="24" width="36" height="26" rx="4" fill="url(#med_grad)" filter="url(#med_glow)"/>
  <!-- Big Play Button in center of clapboard -->
  <circle cx="32" cy="37" r="7.5" fill="#ffffff"/>
  <polygon points="30,33 36,37 30,41" fill="#f43f5e"/>
  <!-- Angled Clap Top Stick -->
  <g transform="rotate(-12 14 22)">
    <rect x="14" y="16" width="36" height="8" rx="2" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
    <polygon points="18,17 22,17 19,23 15,23" fill="#ffffff"/>
    <polygon points="26,17 30,17 27,23 23,23" fill="#ffffff"/>
    <polygon points="34,17 38,17 35,23 31,23" fill="#ffffff"/>
    <polygon points="42,17 46,17 43,23 39,23" fill="#ffffff"/>
  </g>
  <!-- Streaming signal dots -->
  <circle cx="48" cy="14" r="2.5" fill="#d4ff24" filter="url(#med_glow)"/>
</svg>