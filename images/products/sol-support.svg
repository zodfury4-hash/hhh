<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="csrv_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="csrv_head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="csrv_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#csrv_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
  <!-- Support Headset Band -->
  <path d="M18 34 C18 24 24 16 32 16 C40 16 46 24 46 34" fill="none" stroke="url(#csrv_head)" stroke-width="3" stroke-linecap="round" filter="url(#csrv_glow)"/>
  <!-- Left Ear Cushion -->
  <rect x="14" y="30" width="7" height="13" rx="3.5" fill="#d4ff24" filter="url(#csrv_glow)"/>
  <!-- Right Ear Cushion -->
  <rect x="43" y="30" width="7" height="13" rx="3.5" fill="#d4ff24" filter="url(#csrv_glow)"/>
  <!-- Microphone Arm & Tip -->
  <path d="M46 36 V42 C46 45 43 47 40 47 H32" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="30" cy="47" r="3" fill="#38bdf8" filter="url(#csrv_glow)"/>
</svg>