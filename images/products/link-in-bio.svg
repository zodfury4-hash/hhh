<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lib_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="lib_accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="lib_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#lib_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#f472b6" stroke-width="1.5"/>

  <!-- Main showcase card -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1"/>

  <!-- Top Hero Banner / Media box -->
  <rect x="15" y="15" width="34" height="14" rx="5" fill="url(#lib_accent)"/>
  <circle cx="32" cy="22" r="4.5" fill="#ffffff" opacity="0.9"/>
  <polygon points="31,20 34,22 31,24" fill="#8b5cf6"/>

  <!-- Two link chips below -->
  <rect x="15" y="32" width="34" height="7" rx="3.5" fill="#0284c7" opacity="0.9"/>
  <circle cx="19" cy="35.5" r="2" fill="#ffffff"/>
  <line x1="24" y1="35.5" x2="44" y2="35.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="15" y="41" width="34" height="7" rx="3.5" fill="#d4ff24"/>
  <circle cx="19" cy="44.5" r="2" fill="#0f172a"/>
  <line x1="24" y1="44.5" x2="44" y2="44.5" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Floating Star Badge -->
  <circle cx="49" cy="15" r="6" fill="#d4ff24" filter="url(#lib_glow)"/>
  <polygon points="49,11.5 50.2,14 53,14.3 51,16.2 51.5,19 49,17.6 46.5,19 47,16.2 45,14.3 47.8,14" fill="#0f172a"/>
</svg>