<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cpg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="cpg_box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cpg_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#cpg_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#f472b6" stroke-width="1.5"/>
  <!-- Shopping Cart Base -->
  <path d="M12 16 H18 L24 40 H46 L51 23 H20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cart Wheels -->
  <circle cx="26" cy="48" r="4" fill="#d4ff24" filter="url(#cpg_glow)"/>
  <circle cx="44" cy="48" r="4" fill="#d4ff24" filter="url(#cpg_glow)"/>
  <!-- Packaged Good inside Cart -->
  <rect x="25" y="16" width="18" height="18" rx="4" fill="url(#cpg_box)" filter="url(#cpg_glow)"/>
  <!-- Barcode on package -->
  <line x1="28" y1="23" x2="28" y2="30" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="31" y1="23" x2="31" y2="30" stroke="#ffffff" stroke-width="1"/>
  <line x1="34" y1="23" x2="34" y2="30" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="37" y1="23" x2="37" y2="30" stroke="#ffffff" stroke-width="1"/>
  <line x1="40" y1="23" x2="40" y2="30" stroke="#d4ff24" stroke-width="1.5"/>
</svg>