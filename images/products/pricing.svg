<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pr_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063223"/>
      <stop offset="100%" stop-color="#02140d"/>
    </linearGradient>
    <linearGradient id="pr_card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pr_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="pr_glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pr_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
  <!-- 3D Credit Card Body -->
  <rect x="11" y="20" width="38" height="25" rx="5" fill="url(#pr_card)" stroke="rgba(255,255,255,0.3)" stroke-width="1" filter="url(#pr_glow)"/>
  <!-- Magnetic Stripe / Accent -->
  <rect x="11" y="26" width="38" height="4" fill="#044d37"/>
  <!-- Golden EMV Chip -->
  <rect x="16" y="33" width="7" height="6" rx="1.5" fill="url(#pr_gold)"/>
  <circle cx="43" cy="36" r="3.5" fill="rgba(255,255,255,0.7)"/>
  <circle cx="39" cy="36" r="3.5" fill="rgba(212,255,36,0.6)"/>
  <!-- Floating Gold Coins Stack Behind -->
  <circle cx="46" cy="18" r="8" fill="url(#pr_gold)" stroke="#b45309" stroke-width="1.2" filter="url(#pr_glow)"/>
  <text x="46" y="22" font-size="10" font-weight="900" fill="#78350f" text-anchor="middle">$</text>
</svg>