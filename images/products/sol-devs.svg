<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="devs_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="devs_code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#d4ff24"/>
    </linearGradient>
    <filter id="devs_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#devs_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
  <!-- Code Editor Window -->
  <rect x="12" y="14" width="40" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="17" cy="19" r="1.5" fill="#f43f5e"/>
  <circle cx="22" cy="19" r="1.5" fill="#eab308"/>
  <circle cx="27" cy="19" r="1.5" fill="#22c55e"/>
  <!-- Code Chevrons & Slash -->
  <path d="M21 28 L16 33 L21 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="29" y1="27" x2="25" y2="39" stroke="#d4ff24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M33 28 L38 33 L33 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="33" r="2" fill="#d4ff24" filter="url(#devs_glow)"/>
</svg>