<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mcp_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c203b"/>
      <stop offset="100%" stop-color="#050e1b"/>
    </linearGradient>
    <linearGradient id="mcp_gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="mcp_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#mcp_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <!-- Protocol Node Network -->
  <circle cx="32" cy="32" r="10" fill="url(#mcp_gear)" filter="url(#mcp_glow)"/>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
  <!-- 4 Connected Peripheral Hubs -->
  <line x1="32" y1="12" x2="32" y2="22" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="32" cy="12" r="4" fill="#d4ff24" filter="url(#mcp_glow)"/>
  <line x1="32" y1="42" x2="32" y2="52" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="32" cy="52" r="4" fill="#d4ff24" filter="url(#mcp_glow)"/>
  <line x1="12" y1="32" x2="22" y2="32" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="12" cy="32" r="4" fill="#38bdf8" filter="url(#mcp_glow)"/>
  <line x1="42" y1="32" x2="52" y2="32" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="52" cy="32" r="4" fill="#38bdf8" filter="url(#mcp_glow)"/>
</svg>