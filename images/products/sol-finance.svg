<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fin_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="fin_coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="fin_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fin_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <!-- Financial Growth Coin -->
  <circle cx="32" cy="32" r="18" fill="url(#fin_coin)" filter="url(#fin_glow)"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#d4ff24" stroke-width="1.8"/>
  <!-- Dollar Sign -->
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  <!-- Upward Trend Arrow -->
  <polygon points="46,14 46,22 43,19 36,26 31,21 24,28 22,26 31,17 36,22 43,15" fill="#d4ff24" filter="url(#fin_glow)"/>
</svg>