<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tch_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="tch_screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="tch_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tch_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Laptop Display Screen -->
  <rect x="15" y="14" width="34" height="23" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="18" y="17" width="28" height="17" rx="1.5" fill="url(#tch_screen)" opacity="0.8"/>
  <!-- Code line inside laptop screen -->
  <line x1="22" y1="21" x2="32" y2="21" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="25" x2="40" y2="25" stroke="#d4ff24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="29" x2="28" y2="29" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Laptop Base Keyboard Deck -->
  <path d="M10 40 H54 L51 46 C51 47 49 48 48 48 H16 C15 48 13 47 13 46 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="27" y="41" width="10" height="2" rx="1" fill="#d4ff24" filter="url(#tch_glow)"/>
</svg>