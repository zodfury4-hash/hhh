<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HEA Link | Short links &amp; URLs, QR codes &amp; bio pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="css/tokens.css?v=3">
  <link rel="stylesheet" href="css/base.css?v=3">
  <link rel="stylesheet" href="css/legacy/style.css?v=3">
  <link rel="stylesheet" href="css/dashboard.css?v=4">
  <link rel="stylesheet" href="css/landing.css?v=3">
  <script>
    (function() {
      try {
        var p = (window.location.pathname || '').replace(/^\/+|\/+$/g, '').toLowerCase();
        var reserved = ['index.html', 'login', 'signup', 'app', 'dashboard', 'pricing', 'features', 'solutions', 'about', 'contact', 'terms', 'privacy', 'api', 'r', 'go'];
        if (p && reserved.indexOf(p) === -1 && !p.includes('.')) {
          var dest = localStorage.getItem('hea_slug_' + p);
          if (!dest) {
            var map = JSON.parse(localStorage.getItem('hea_slug_map') || '{}');
            dest = map[p];
          }
          if (!dest) {
            var links = JSON.parse(localStorage.getItem('hea_links') || '[]');
            var m = links.find(function(l) { return l && l.slug && l.slug.toLowerCase() === p; });
            if (m && m.dest) dest = m.dest;
          }
          if (dest && /^https?:\/\//i.test(dest)) {
            window.location.replace(dest);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
