<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bl_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#302008"/>
      <stop offset="100%" stop-color="#120c03"/>
    </linearGradient>
    <linearGradient id="bl_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="bl_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bl_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(234,179,8,0.45)" stroke-width="1.5"/>

  <!-- Golden Security Shield -->
  <path d="M32 10 L48 16 V28 C48 38 41 47 32 51 C23 47 16 38 16 28 V16 Z" 
        fill="rgba(234,179,8,0.15)" stroke="url(#bl_gold)" stroke-width="2.5" filter="url(#bl_glow)"/>

  <!-- Branded Domain Pill inside shield -->
  <rect x="20" y="23" width="24" height="8" rx="4" fill="#0f172a" stroke="#fde047" stroke-width="1"/>
  <text x="32" y="29" font-family="system-ui, sans-serif" font-size="5" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="0.3">brand.co</text>

  <!-- Golden Padlock -->
  <rect x="26" y="35" width="12" height="9" rx="2" fill="url(#bl_gold)"/>
  <path d="M28.5 35 V32 C28.5 30 30 28.5 32 28.5 C34 28.5 35.5 30 35.5 32 V35" fill="none" stroke="url(#bl_gold)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="39" r="1.2" fill="#0f172a"/>

  <!-- Sparkle stars -->
  <polygon points="49,10 50.5,13 54,14 50.5,15 49,18 47.5,15 44,14 47.5,13" fill="#ffffff" filter="url(#bl_glow)"/>
  <polygon points="14,35 15,37 17,38 15,39 14,41 13,39 11,38 13,37" fill="#fde047"/>
</svg>