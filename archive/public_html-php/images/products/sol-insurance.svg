<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ins_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d38"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="ins_shd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="ins_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ins_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <!-- Protective Shield -->
  <path d="M32 10 L48 16 V28 C48 39 41 48 32 52 C23 48 16 39 16 28 V16 Z" fill="url(#ins_shd)" filter="url(#ins_glow)"/>
  <!-- Umbrella Protection inside Shield -->
  <path d="M22 28 C22 21 26 19 32 19 C38 19 42 21 42 28 Z" fill="#d4ff24"/>
  <line x1="32" y1="21" x2="32" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 38 C32 40 30 42 28 41" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>