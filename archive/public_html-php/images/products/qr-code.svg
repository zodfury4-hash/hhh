<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="qr_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1438"/>
      <stop offset="100%" stop-color="#0c071d"/>
    </linearGradient>
    <linearGradient id="qr_beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(212,255,36,0)"/>
      <stop offset="100%" stop-color="rgba(212,255,36,0.5)"/>
    </linearGradient>
    <filter id="qr_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#qr_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(168,85,247,0.45)" stroke-width="1.5"/>
  
  <!-- Outer Finder 1 (Top-Left) -->
  <rect x="13" y="13" width="14" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="17" y="17" width="6" height="6" rx="1.5" fill="#38bdf8"/>
  
  <!-- Outer Finder 2 (Top-Right) -->
  <rect x="37" y="13" width="14" height="14" rx="3" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="41" y="17" width="6" height="6" rx="1.5" fill="#a855f7"/>
  
  <!-- Outer Finder 3 (Bottom-Left) -->
  <rect x="13" y="37" width="14" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="17" y="41" width="6" height="6" rx="1.5" fill="#38bdf8"/>
  
  <!-- Data modules -->
  <rect x="31" y="15" width="3" height="5" rx="1" fill="#d4ff24"/>
  <rect x="31" y="24" width="5" height="3" rx="1" fill="#38bdf8"/>
  <rect x="39" y="31" width="4" height="4" rx="1" fill="#a855f7"/>
  <rect x="45" y="31" width="5" height="3" rx="1" fill="#d4ff24"/>
  <rect x="31" y="37" width="4" height="5" rx="1" fill="#ffffff"/>
  <rect x="38" y="39" width="5" height="4" rx="1" fill="#38bdf8"/>
  <rect x="45" y="38" width="5" height="5" rx="1" fill="#d4ff24"/>
  <rect x="38" y="46" width="4" height="5" rx="1" fill="#ffffff"/>
  <rect x="45" y="46" width="5" height="4" rx="1" fill="#a855f7"/>
  <rect x="31" y="46" width="4" height="4" rx="1" fill="#d4ff24"/>

  <!-- Glowing Laser Scan Beam -->
  <rect x="10" y="26" width="44" height="7" fill="url(#qr_beam)"/>
  <line x1="9" y1="33" x2="55" y2="33" stroke="#d4ff24" stroke-width="2" filter="url(#qr_glow)"/>
</svg>