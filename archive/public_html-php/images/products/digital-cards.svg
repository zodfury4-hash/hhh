<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dc_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111e3b"/>
      <stop offset="100%" stop-color="#080f1e"/>
    </linearGradient>
    <linearGradient id="dc_card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="dc_chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="dc_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#dc_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>

  <!-- Angled Virtual Card -->
  <rect x="11" y="16" width="42" height="28" rx="5" fill="url(#dc_card)" stroke="#38bdf8" stroke-width="1.8" filter="url(#dc_glow)"/>

  <!-- Metallic Gold Smart Chip -->
  <rect x="16" y="22" width="9" height="7" rx="1.5" fill="url(#dc_chip)"/>
  <line x1="16" y1="25.5" x2="25" y2="25.5" stroke="#78350f" stroke-width="0.6"/>
  <line x1="20.5" y1="22" x2="20.5" y2="29" stroke="#78350f" stroke-width="0.6"/>

  <!-- Contactless NFC waves icon on card -->
  <path d="M29 23 C30.5 24.5 30.5 26.5 29 28" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M31.5 21 C34 23.5 34 27.5 31.5 30" fill="none" stroke="#d4ff24" stroke-width="1.2" stroke-linecap="round"/>

  <!-- User profile silhouette badge right side -->
  <circle cx="45" cy="24" r="3.5" fill="#38bdf8"/>
  <path d="M40 33 C40 30 42 29 45 29 C48 29 50 30 50 33 Z" fill="#38bdf8"/>

  <!-- Virtual Card bottom details -->
  <rect x="16" y="37" width="18" height="2" rx="1" fill="#94a3b8"/>
  <rect x="16" y="40" width="10" height="1.5" rx="0.7" fill="#64748b"/>

  <!-- Floating tap checkmark badge -->
  <circle cx="48" cy="43" r="6" fill="#d4ff24" filter="url(#dc_glow)"/>
  <polyline points="45,43 47,45 51,41" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>