<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pr_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09281a"/>
      <stop offset="100%" stop-color="#03120b"/>
    </linearGradient>
    <linearGradient id="pr_coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4ff24"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="pr_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pr_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(212,255,36,0.4)" stroke-width="1.5"/>
  <!-- Gold Credit Card Backing -->
  <rect x="12" y="16" width="40" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="12" y="22" width="40" height="6" fill="#38bdf8" opacity="0.4"/>
  <!-- Shiny Coin in foreground -->
  <circle cx="42" cy="40" r="13" fill="url(#pr_coin)" filter="url(#pr_glow)"/>
  <circle cx="42" cy="40" r="10" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="42" y="44.5" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">$</text>
</svg>