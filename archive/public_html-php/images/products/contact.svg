<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cs_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1038"/>
      <stop offset="100%" stop-color="#080414"/>
    </linearGradient>
    <linearGradient id="cs_hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="cs_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#cs_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(129,140,248,0.4)" stroke-width="1.5"/>
  <!-- Handshake partnership -->
  <path d="M14 34 L24 24 C25 23 27 23 28 24 L32 28 L40 20 C41 19 43 19 44 20 L50 26" fill="none" stroke="url(#cs_hand)" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 36 L30 40 C31 41 33 41 34 40 L44 30" fill="none" stroke="#d4ff24" stroke-width="3" stroke-linecap="round" filter="url(#cs_glow)"/>
  <!-- Clasp knot -->
  <circle cx="32" cy="34" r="3.5" fill="#ffffff"/>
  <!-- Sparkles -->
  <polygon points="32,14 33.5,17 36.5,18 33.5,19 32,22 30.5,19 27.5,18 30.5,17" fill="#d4ff24" filter="url(#cs_glow)"/>
</svg>