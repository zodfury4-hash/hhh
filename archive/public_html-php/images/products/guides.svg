<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gd_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2638"/>
      <stop offset="100%" stop-color="#051019"/>
    </linearGradient>
    <linearGradient id="gd_book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="gd_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#gd_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <!-- Book Cover -->
  <path d="M18 14 H44 C46.2 14 48 15.8 48 18 V48 C48 50.2 46.2 52 44 52 H18 Z" fill="url(#gd_book)" filter="url(#gd_glow)"/>
  <!-- Book Spine -->
  <path d="M18 14 H22 V52 H18 C15.8 52 14 50.2 14 48 V18 C14 15.8 15.8 14 18 14 Z" fill="#0369a1"/>
  <!-- Gold Bookmark Ribbon -->
  <path d="M38 14 V30 L41 27 L44 30 V14 Z" fill="#d4ff24"/>
  <!-- Book Details -->
  <line x1="26" y1="24" x2="36" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="34" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="26" y1="36" x2="42" y2="36" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>