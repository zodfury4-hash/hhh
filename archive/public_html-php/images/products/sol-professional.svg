<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="prof_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151b36"/>
      <stop offset="100%" stop-color="#070a17"/>
    </linearGradient>
    <linearGradient id="prof_case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="prof_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#prof_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <!-- Executive Briefcase Body -->
  <rect x="14" y="22" width="36" height="26" rx="5" fill="url(#prof_case)" filter="url(#prof_glow)"/>
  <!-- Briefcase Handle -->
  <path d="M25 22 V16 C25 14.5 26.5 13 28 13 H36 C37.5 13 39 14.5 39 16 V22" fill="none" stroke="#d4ff24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Metallic Clasp & Stripe -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="29" y="30" width="6" height="6" rx="1.5" fill="#d4ff24"/>
</svg>