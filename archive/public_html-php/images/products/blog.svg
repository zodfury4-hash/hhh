<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#120a03"/>
    </linearGradient>
    <linearGradient id="blg_pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="blg_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#blg_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(251,191,36,0.4)" stroke-width="1.5"/>
  <!-- Article document sheet -->
  <rect x="14" y="14" width="30" height="38" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
  <line x1="20" y1="22" x2="36" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="34" y2="28" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="34" x2="38" y2="34" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="40" x2="30" y2="40" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Angled Pen writing on document -->
  <g transform="rotate(-30 42 36)">
    <rect x="39" y="16" width="6" height="24" rx="2" fill="url(#blg_pen)" filter="url(#blg_glow)"/>
    <polygon points="39,40 45,40 42,46" fill="#d4ff24"/>
  </g>
</svg>