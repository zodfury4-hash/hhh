<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="edu_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1238"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </linearGradient>
    <linearGradient id="edu_cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="edu_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#edu_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
  <!-- Graduation Cap Rhombus Top -->
  <polygon points="32,15 52,24 32,33 12,24" fill="url(#edu_cap)" filter="url(#edu_glow)"/>
  <!-- Cap Skull Base -->
  <path d="M20 28 V36 C20 41 25 45 32 45 C39 45 44 41 44 36 V28" fill="#4338ca"/>
  <!-- Golden Tassel and Cord -->
  <path d="M32 24 C38 24 45 28 47 34" fill="none" stroke="#d4ff24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47" cy="36" r="2.5" fill="#d4ff24" filter="url(#edu_glow)"/>
  <!-- Knowledge Diploma Scroll -->
  <rect x="22" y="47" width="20" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="30" y="46" width="4" height="7" rx="1" fill="#d4ff24"/>
</svg>