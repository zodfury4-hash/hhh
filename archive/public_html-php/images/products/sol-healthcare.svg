<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hlth_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2a24"/>
      <stop offset="100%" stop-color="#03120f"/>
    </linearGradient>
    <linearGradient id="hlth_cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="hlth_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hlth_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(45,212,191,0.4)" stroke-width="1.5"/>
  <!-- Emergency Medical Cross Badge -->
  <path d="M26 13 H38 V22 H47 V34 H38 V43 H26 V34 H17 V22 H26 Z" fill="url(#hlth_cross)" filter="url(#hlth_glow)"/>
  <!-- Heartbeat ECG Pulse Wave in foreground -->
  <path d="M12 36 L22 36 L26 27 L31 45 L36 30 L40 38 L43 36 L52 36" fill="none" stroke="#d4ff24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#hlth_glow)"/>
  <circle cx="36" cy="30" r="2.5" fill="#ffffff"/>
</svg>