<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page or Link Not Found | HEA Link</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f1f44 0%, #060b18 65%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(11, 19, 43, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      padding: 44px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      color: #f8fafc;
      margin-bottom: 20px;
      text-decoration: none;
    }
    .code {
      font-size: 68px;
      font-weight: 900;
      line-height: 1;
      margin: 0 0 12px;
      background: linear-gradient(135deg, #38bdf8, #0070f3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 22px; margin: 0 0 10px; font-weight: 700; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }
    .btn-primary { background: #0070f3; color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.14); }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">HEA Link</a>
    <div class="code">404</div>
    <h1>Page or Short Link Not Found</h1>
    <p>The page or short URL you requested does not exist or may have been removed by its owner.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Go to Homepage</a>
      <a class="btn btn-secondary" href="/app.html#dashboard">Open Dashboard</a>
    </div>
  </main>
</body>
</html>
