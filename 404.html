<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting — HEA Link</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      // 1. Extract path, query and hash
      const path = window.location.pathname || '';
      const search = window.location.search || '';
      const params = new URLSearchParams(search);

      // Direct URL passed via query param (Instant Safe Fallback)
      const uParam = params.get('u') || params.get('url') || params.get('dest');
      if (uParam) {
        try {
          const decoded = decodeURIComponent(uParam);
          if (/^https?:\/\//i.test(decoded)) {
            window.location.replace(decoded);
            return;
          }
        } catch (e) {}
      }

      // 2. Extract Slug from pathname
      // Handles: /r/:slug, /:slug, /m/:slug
      let slug = params.get('c') || params.get('slug') || '';
      if (!slug) {
        const rMatch = path.match(/^\/r\/([^\/?#]+)/i);
        const mMatch = path.match(/^\/m\/([^\/?#]+)/i);
        const rootMatch = path.match(/^\/([^\/?#]+)/i);

        if (rMatch) {
          slug = rMatch[1];
        } else if (mMatch) {
          // Bio page -> redirect to /#bio-:slug
          window.location.replace('/#bio-' + mMatch[1]);
          return;
        } else if (rootMatch && rootMatch[1] !== 'index.html' && rootMatch[1] !== '404.html') {
          slug = rootMatch[1];
        }
      }

      // If route is a SPA top-level view, forward to index.html with hash
      const spaRoutes = [
        'dashboard', 'pricing', 'login', 'signup', 'faq', 'solutions',
        'resources', 'assist', 'analytics', 'pages', 'domains',
        'integrations', 'settings', 'utm', 'create-link', 'links', 'qr'
      ];
      if (slug && spaRoutes.includes(slug.toLowerCase())) {
        window.location.replace('/#' + slug);
        return;
      }

      // 3. Resolve destination from LocalStorage
      if (slug) {
        const cleanSlug = slug.toLowerCase();
        let targetUrl = null;

        // A. Direct slug key
        try {
          targetUrl = localStorage.getItem('hea_slug_' + cleanSlug) || localStorage.getItem('hea_slug_' + slug);
        } catch (e) {}

        // B. Search inside hea_links array
        if (!targetUrl) {
          try {
            const raw = localStorage.getItem('hea_links');
            if (raw) {
              const list = JSON.parse(raw);
              if (Array.isArray(list)) {
                const found = list.find(x => (x.slug && x.slug.toLowerCase() === cleanSlug) || x.id === slug || x.slug === slug);
                if (found) {
                  targetUrl = found.url || found.dest;
                  // Record local click count
                  if (Array.isArray(found.clicks)) {
                    found.clicks.push({ t: Date.now(), ip: 'direct' });
                  } else if (typeof found.clicks === 'number') {
                    found.clicks++;
                  }
                  localStorage.setItem('hea_links', JSON.stringify(list));
                }
              }
            }
          } catch (e) {}
        }

        // C. Search inside hea_slug_map
        if (!targetUrl) {
          try {
            const mapRaw = localStorage.getItem('hea_slug_map');
            if (mapRaw) {
              const map = JSON.parse(mapRaw);
              if (map && (map[cleanSlug] || map[slug])) {
                targetUrl = map[cleanSlug] || map[slug];
              }
            }
          } catch (e) {}
        }

        // If targetUrl found, redirect immediately!
        if (targetUrl) {
          if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl;
          window.location.replace(targetUrl);
          return;
        }

        // 4. Fallback: Query backend API if reachable
        fetch('/api/links/' + encodeURIComponent(slug))
          .then(res => res.json())
          .then(data => {
            const dest = data.url || data.dest || (data.link && (data.link.url || data.link.dest));
            if (dest) {
              window.location.replace(dest);
            } else {
              showNotFound(slug);
            }
          })
          .catch(() => {
            // Also check for default sample demo links
            const demoLinks = {
              '3weoeoz': 'https://claude.ai/chat/7f036851-018e-4d51-a859-3730634bb296',
              'summer-26': 'https://myshopify.store/products/summer-drop-2026'
            };
            if (demoLinks[cleanSlug]) {
              window.location.replace(demoLinks[cleanSlug]);
            } else {
              showNotFound(slug);
            }
          });
      } else {
        window.location.replace('/');
      }

      function showNotFound(failedSlug) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => renderNotFoundUI(failedSlug));
        } else {
          renderNotFoundUI(failedSlug);
        }
      }

      function renderNotFoundUI(failedSlug) {
        const lEl = document.getElementById('loadingBox');
        const nEl = document.getElementById('notFoundBox');
        const sEl = document.getElementById('failedSlugText');
        if (lEl) lEl.style.display = 'none';
        if (nEl) nEl.style.display = 'block';
        if (sEl) sEl.textContent = 'healink.store/r/' + failedSlug;
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: #f0f6ff;
      color: #0b132b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 112, 243, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
    }
    .redirect-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 50, 150, 0.08);
    }
    .brand-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: #0b132b; margin-bottom: 24px; text-decoration: none; }
    .brand-logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .spinner-ring {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #0b132b; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    .badge-slug {
      display: inline-block;
      margin: 14px 0 20px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 99px;
      color: #38bdf8;
      font-weight: 600;
      font-size: 13px;
      word-break: break-all;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, #0084ff 0%, #00d2ff 65%, #10b981 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 99px;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 180, 255, 0.45);
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <a href="/" class="brand-logo">
      <img src="/logo.png" alt="HEA Link">
      <span><b style="font-style:italic">HEA</b> <span style="color:#D4FF24">Link</span></span>
    </a>

    <!-- Loading State -->
    <div id="loadingBox">
      <div class="spinner-ring"></div>
      <h2>Redirecting to destination…</h2>
      <p>Securely connecting you through HEA Link speed engine.</p>
    </div>

    <!-- Not Found State (Fallback) -->
    <div id="notFoundBox" style="display:none;">
      <div style="font-size:42px;margin-bottom:12px;">🔍</div>
      <h2>Link Not Found or Expired</h2>
      <p>The short link you are trying to visit was not found or has expired:</p>
      <div class="badge-slug" id="failedSlugText">healink.store/r/...</div>
      <div>
        <a href="/" class="action-btn">Go to HEA Link Homepage →</a>
      </div>
    </div>
  </div>
</body>
</html>
