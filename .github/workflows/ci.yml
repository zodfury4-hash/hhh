name: HEA Link CI

on:
  push:
    branches: [ main, cleanup/auth-single ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Build, Test & Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend & landing dependencies
        run: npm ci && npm --prefix frontend-landing ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Landing & Dashboard bundles
        run: npm run build:landing && npm run build:dashboard

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run 23-Suite Automated Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_ci_jwt_secret_min_32_characters_long_12345

      - name: Run Playwright Browser E2E (Node 22)
        if: matrix.node-version == '22.x'
        run: |
          npx playwright-core install chromium --with-deps || true
          npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: test_ci_jwt_secret_min_32_characters_long_12345
