<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ai_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190d38"/>
      <stop offset="100%" stop-color="#080414"/>
    </linearGradient>
    <linearGradient id="ai_spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#d4ff24"/>
    </linearGradient>
    <filter id="ai_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ai_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
  <!-- Central Glowing AI Sparkle -->
  <path d="M32 12 Q32 26 18 32 Q32 32 32 52 Q32 32 46 32 Q32 26 32 12 Z" fill="url(#ai_spark)" filter="url(#ai_glow)"/>
  <!-- Orbit Ring -->
  <ellipse cx="32" cy="32" rx="20" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" transform="rotate(-25 32 32)"/>
  <!-- Satellite nodes -->
  <circle cx="15" cy="24" r="2.5" fill="#d4ff24" filter="url(#ai_glow)"/>
  <circle cx="49" cy="40" r="2.5" fill="#38bdf8" filter="url(#ai_glow)"/>
  <!-- Small secondary sparkle -->
  <polygon points="46,14 47.5,17 50.5,18 47.5,19 46,22 44.5,19 41.5,18 44.5,17" fill="#d4ff24"/>
</svg>