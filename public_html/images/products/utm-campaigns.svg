<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="utm_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1509"/>
      <stop offset="100%" stop-color="#120803"/>
    </linearGradient>
    <linearGradient id="utm_tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="utm_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#utm_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(249,115,22,0.45)" stroke-width="1.5"/>

  <!-- Target Rings (Bullseye) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(249,115,22,0.25)" stroke-width="2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(249,115,22,0.45)" stroke-width="2"/>
  <circle cx="32" cy="32" r="8" fill="rgba(249,115,22,0.3)"/>
  <circle cx="32" cy="32" r="3" fill="#d4ff24" filter="url(#utm_glow)"/>

  <!-- Angled Price / Campaign Tag -->
  <g transform="rotate(-15 32 32)">
    <path d="M22 17 H34 L43 26 L31 38 L22 29 Z" fill="url(#utm_tag)" stroke="#ffffff" stroke-width="1.5" filter="url(#utm_glow)"/>
    <circle cx="26" cy="22" r="2" fill="#ffffff"/>
    <path d="M24 20 C18 16 14 18 12 22" fill="none" stroke="#d4ff24" stroke-width="1.8" stroke-linecap="round"/>
    <text x="32" y="29" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle">UTM</text>
  </g>

  <!-- Dart arrow tip hitting center -->
  <polygon points="48,16 45,21 42,20 40,25 36,25 39,21 38,18 43,18" fill="#d4ff24"/>
</svg>