<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pb_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e102f"/>
      <stop offset="100%" stop-color="#0e0717"/>
    </linearGradient>
    <linearGradient id="pb_phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pb_avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="pb_btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="pb_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pb_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(244,63,94,0.4)" stroke-width="1.5"/>

  <!-- Phone Shell -->
  <rect x="18" y="9" width="28" height="46" rx="6" fill="url(#pb_phone)" stroke="#e2e8f0" stroke-width="1.8"/>
  <line x1="29" y1="12" x2="35" y2="12" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Profile Avatar -->
  <circle cx="32" cy="21" r="5" fill="url(#pb_avatar)"/>
  <circle cx="32" cy="19.5" r="2" fill="#ffffff"/>
  <path d="M28.5 24.5 C28.5 22.8 30.2 22.5 32 22.5 C33.8 22.5 35.5 22.8 35.5 24.5 Z" fill="#ffffff"/>

  <!-- Verified Check -->
  <circle cx="37.5" cy="23.5" r="2" fill="#d4ff24"/>
  <polyline points="36.5,23.5 37.2,24.3 38.8,22.8" stroke="#0f172a" stroke-width="0.6" fill="none"/>

  <!-- Bio title line -->
  <rect x="26" y="28" width="12" height="2" rx="1" fill="#ffffff"/>

  <!-- Stacked link buttons inside mobile -->
  <rect x="21.5" y="32" width="21" height="4.5" rx="2.2" fill="url(#pb_btn)"/>
  <rect x="21.5" y="38.5" width="21" height="4.5" rx="2.2" fill="#d4ff24"/>
  <rect x="21.5" y="45" width="21" height="4.5" rx="2.2" fill="rgba(255,255,255,0.18)"/>

  <!-- Floating heart icon -->
  <circle cx="48" cy="17" r="7" fill="#f43f5e" filter="url(#pb_glow)"/>
  <path d="M48 19.8 L44.8 16.6 C43.8 15.6 43.8 14 44.8 13 C45.8 12.1 47.4 12.2 48 13.2 C48.6 12.2 50.2 12.1 51.2 13 C52.2 14 52.2 15.6 51.2 16.6 Z" fill="#ffffff"/>
</svg>