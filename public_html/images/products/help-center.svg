<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hc_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="hc_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="hc_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hc_bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <!-- Lifebuoy / Help ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#hc_ring)" stroke-width="5" filter="url(#hc_glow)"/>
  <circle cx="32" cy="32" r="9" fill="rgba(15,23,42,0.8)" stroke="#d4ff24" stroke-width="1.5"/>
  <!-- Question mark in center -->
  <text x="32" y="36.5" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#d4ff24" text-anchor="middle">?</text>
  <!-- White strap bands on lifebuoy -->
  <rect x="30" y="9" width="4" height="6" fill="#ffffff" rx="1"/>
  <rect x="30" y="49" width="4" height="6" fill="#ffffff" rx="1"/>
  <rect x="9" y="30" width="6" height="4" fill="#ffffff" rx="1"/>
  <rect x="49" y="30" width="6" height="4" fill="#ffffff" rx="1"/>
</svg>